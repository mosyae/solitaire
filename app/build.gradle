plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub Actions workflow).
def ksFile = System.getenv('KEYSTORE_FILE')
def hasKeystore = ksFile != null && file(ksFile).exists()

android {
    namespace 'com.mosyae.solitaire'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mosyae.solitaire'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName "1.0.${System.getenv('VERSION_CODE') ?: '0'}"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'solitaire'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game itself lives in /web and is bundled as app assets.
    sourceSets {
        main {
            assets.srcDirs = ['../web']
        }
    }
}
