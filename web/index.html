<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b5d2a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Solitaire</title>
<style>
:root{--w:50px;--h:70px;--rad:5px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0b5d2a;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top);
  background:radial-gradient(ellipse at 50% 25%,#1c9a4c 0%,#0f6e33 45%,#084a22 100%)}
header{display:flex;justify-content:space-around;align-items:center;color:#fff;padding:10px 8px;font-size:16px;
  background:rgba(0,0,0,.28);font-variant-numeric:tabular-nums}
header b{font-weight:600}
#board{flex:1;position:relative;overflow:hidden}
#board.notrans .card{transition:none!important}
nav{display:flex;justify-content:space-around;background:rgba(0,0,0,.45);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 14px;font-family:inherit;letter-spacing:.5px}
nav button:active{opacity:.6}
nav svg{width:26px;height:26px;fill:currentColor}
nav button:disabled{opacity:.35}
.slot{position:absolute;width:var(--w);height:var(--h);border-radius:var(--rad);border:2px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.13);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.18);
  font-size:calc(var(--w)*.55);font-weight:700}
.slot svg{width:55%;height:55%;fill:rgba(255,255,255,.3)}
.card{position:absolute;left:0;top:0;width:var(--w);height:var(--h);border-radius:var(--rad);
  transition:left .2s ease,top .2s ease;will-change:left,top}
.card.up{background:#fff;border:1px solid #9a9a9a;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.card.down{border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4);
  background:repeating-linear-gradient(45deg,#2a6fb5 0 3px,#4a92d6 3px 6px)}
.card .r{position:absolute;left:5%;top:3%;font-weight:700;font-size:calc(var(--w)*.38);line-height:1;letter-spacing:-1px}
.card .s{position:absolute;right:5%;top:5%;width:calc(var(--w)*.3);height:calc(var(--w)*.3)}
.card .c{position:absolute;left:18%;right:18%;bottom:7%;width:64%;height:auto;aspect-ratio:1}
.card svg{fill:currentColor;display:block}
.card.red{color:#d50000}.card.blk{color:#111}
.card.down>*{display:none}
.card.drag{transition:none!important}
.card.hint{animation:hint .45s 4 alternate}
@keyframes hint{to{box-shadow:0 0 0 3px #ffd400,0 0 16px 4px #ffd400}}
.card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.slot.hint{animation:hint .45s 4 alternate}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;
  transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:3000}
#toast.show{opacity:1}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}
#dlg .box{background:#fff;color:#222;border-radius:16px;width:100%;max-width:340px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#dlg h2{margin:0 0 12px;font-size:21px;text-align:center}
#dlg .body{font-size:15px;line-height:1.5;margin-bottom:14px}
#dlg .btns{display:flex;flex-direction:column;gap:8px}
#dlg button{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:0;background:#e9ecef;color:#222}
#dlg button.pri{background:#0f7a39;color:#fff;font-weight:600}
#dlg button:active{filter:brightness(.9)}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid #0f7a39;margin:6px 0 4px}
.seg button{flex:1;border-radius:0!important;background:#fff!important}
.seg button.on{background:#0f7a39!important;color:#fff!important;font-weight:600}
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.stats span:nth-child(even){text-align:right;font-weight:600}
.muted{color:#777;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>Score: <b id="score">0</b></div>
    <div id="time">00:00</div>
    <div>Moves: <b id="moves">0</b></div>
  </header>
  <main id="board"></main>
  <nav>
    <button id="bMenu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>MENU</button>
    <button id="bNew"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>NEW</button>
    <button id="bHint"><svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>HINT</button>
    <button id="bUndo"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>UNDO</button>
  </nav>
</div>
<div id="dlg" hidden><div class="box"><h2 id="dlgT"></h2><div class="body" id="dlgB"></div><div class="btns" id="dlgBtns"></div></div></div>
<div id="toast"></div>

<script src="game.js"></script>
</body>
</html>
